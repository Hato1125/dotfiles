format = "\\$$directory$git_branch$git_status"

add_newline = false

[directory]
style = "fg:#ffffff"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:#ffffff"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:#ffffff"
format = "[$all_status$ahead_behind ]($style)"
